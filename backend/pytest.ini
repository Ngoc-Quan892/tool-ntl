[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=json
    --cov-branch
    --cov-fail-under=80
    --maxfail=5
markers =
    unit: Unit tests
    integration: Integration tests requiring full stack
    performance: Performance tests
    security: Security tests
    slow: Tests that take >5 seconds
    e2e: End-to-end tests
    requires_monitoring: Tests that require Prometheus/Grafana
    requires_cache: Tests that require Redis cache
    requires_docker: Tests needing Docker services
    requires_redis: Tests needing Redis
    requires_db: Tests needing database

