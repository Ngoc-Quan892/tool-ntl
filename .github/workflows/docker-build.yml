name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build backend
      run: docker build -t baccarat-backend ./backend
    
    - name: Build frontend
      run: docker build -t baccarat-frontend ./frontend
    
    - name: Test docker-compose
      run: docker-compose config

