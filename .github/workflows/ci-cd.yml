name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== LINT & TEST ====================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (Backend)
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        if: matrix.component == 'backend'
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend linter
        if: matrix.component == 'backend'
        working-directory: ./backend
        run: |
          pip install flake8 black isort mypy
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check app
          isort --check-only app

      - name: Run backend tests
        if: matrix.component == 'backend'
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html

      - name: Upload backend coverage
        if: matrix.component == 'backend'
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Set up Node.js (Frontend)
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.component == 'frontend'
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linter
        if: matrix.component == 'frontend'
        working-directory: ./frontend
        run: npm run lint || echo "Linter not configured"

      - name: Run frontend type check
        if: matrix.component == 'frontend'
        working-directory: ./frontend
        run: npm run build --dry-run || npx tsc --noEmit

      - name: Run frontend tests
        if: matrix.component == 'frontend'
        working-directory: ./frontend
        run: npm test -- --coverage --run

      - name: Upload frontend coverage
        if: matrix.component == 'frontend'
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # ==================== BUILD DOCKER IMAGES ====================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        component: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || 'http://localhost/api' }}

  # ==================== SECURITY SCAN ====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run detect-secrets baseline check
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          python -m pip install --upgrade pip
          python -m pip install detect-secrets
          # Scan comparing against baseline; produce JSON output
          detect-secrets scan --all-files --baseline .secrets.baseline > detect-secrets-output.json || true
          # If there are any results not in baseline, fail the job
          if [ "$(jq '.results | length' detect-secrets-output.json)" -ne 0 ]; then
            echo "New/Unapproved secrets detected"
            cat detect-secrets-output.json
            exit 1
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ==================== DEPLOY ====================
  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event.inputs.environment)
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ secrets.DEPLOYMENT_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create deployment backup
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Create backup directory with timestamp
            BACKUP_DIR="backups/$(date +%Y%m%d_%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            
            # Save current deployment state
            docker-compose -f deployment/docker-compose.prod.yml ps > "$BACKUP_DIR/containers.txt" || true
            docker-compose -f deployment/docker-compose.prod.yml config > "$BACKUP_DIR/compose-config.yaml"
            docker images | grep -E "(backend|frontend)" > "$BACKUP_DIR/images.txt" || true
            
            # Save current image tags
            docker-compose -f deployment/docker-compose.prod.yml config | grep -E "image:" > "$BACKUP_DIR/image-tags.txt" || true
            
            echo "BACKUP_DIR=$BACKUP_DIR" > /tmp/backup_info.env
          EOF

      - name: Deploy to server
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Load backup directory
            source /tmp/backup_info.env
            
            # Pull latest images
            echo "Pulling latest images..."
            docker-compose -f deployment/docker-compose.prod.yml pull
            
            # Deploy new version with zero-downtime strategy
            echo "Deploying new version..."
            docker-compose -f deployment/docker-compose.prod.yml up -d --no-deps --build backend frontend
            
            # Wait for health checks with retries
            echo "Waiting for health checks..."
            MAX_RETRIES=30
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost/health > /dev/null 2>&1; then
                echo "Health check passed!"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Health check failed, retry $RETRY_COUNT/$MAX_RETRIES..."
              sleep 2
            done
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "Health check failed after $MAX_RETRIES retries"
              echo "DEPLOYMENT_FAILED=true" > /tmp/deploy_status.env
              exit 1
            fi
            
            # Verify all services are healthy
            echo "Verifying all services..."
            docker-compose -f deployment/docker-compose.prod.yml ps
            
            # Check backend health
            BACKEND_HEALTH=$(docker-compose -f deployment/docker-compose.prod.yml exec -T backend curl -f http://localhost:8000/health || echo "failed")
            if [[ "$BACKEND_HEALTH" == *"failed"* ]]; then
              echo "Backend health check failed"
              echo "DEPLOYMENT_FAILED=true" > /tmp/deploy_status.env
              exit 1
            fi
            
            # Clean up old images (keep last 3 versions)
            echo "Cleaning up old images..."
            docker image prune -f
            
            echo "DEPLOYMENT_SUCCESS=true" > /tmp/deploy_status.env
            echo "Deployment completed successfully!"
          EOF

      - name: Rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Load backup directory
            source /tmp/backup_info.env
            
            echo "Deployment failed, initiating rollback..."
            
            # Restore previous images if available
            if [ -f "$BACKUP_DIR/image-tags.txt" ]; then
              echo "Rolling back to previous version..."
              docker-compose -f deployment/docker-compose.prod.yml down backend frontend
              
              # Restore from backup config if available
              if [ -f "$BACKUP_DIR/compose-config.yaml" ]; then
                # Extract previous image tags and restore
                PREV_IMAGES=$(cat "$BACKUP_DIR/image-tags.txt")
                echo "Previous images: $PREV_IMAGES"
              fi
              
              # Restart with previous configuration
              docker-compose -f deployment/docker-compose.prod.yml up -d backend frontend
              
              # Wait for health checks
              sleep 30
              
              # Verify rollback
              if curl -f http://localhost/health; then
                echo "Rollback completed successfully"
              else
                echo "Rollback health check failed"
                exit 1
              fi
            else
              echo "No backup found, cannot rollback automatically"
              exit 1
            fi
          EOF

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment to ${{ inputs.environment || "staging" }}: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ==================== MANUAL ROLLBACK ====================
  rollback:
    name: Manual Rollback
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: List available backups
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Available backups:"
            ls -lt backups/ | head -10 || echo "No backups found"
          EOF

      - name: Rollback to previous version
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKUP_DIR: ${{ github.event.inputs.backup_dir || 'latest' }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Find latest backup if not specified
            if [ "$BACKUP_DIR" == "latest" ]; then
              BACKUP_DIR=$(ls -t backups/ | head -1)
            fi
            
            if [ ! -d "backups/$BACKUP_DIR" ]; then
              echo "Backup directory not found: backups/$BACKUP_DIR"
              exit 1
            fi
            
            echo "Rolling back to: backups/$BACKUP_DIR"
            
            # Stop current services
            docker-compose -f deployment/docker-compose.prod.yml down backend frontend
            
            # Restore from backup
            if [ -f "backups/$BACKUP_DIR/compose-config.yaml" ]; then
              # Use backup configuration
              docker-compose -f "backups/$BACKUP_DIR/compose-config.yaml" up -d
            else
              # Fallback: restart with current config but previous images
              docker-compose -f deployment/docker-compose.prod.yml up -d backend frontend
            fi
            
            # Wait for health checks
            echo "Waiting for services to be healthy..."
            MAX_RETRIES=30
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost/health > /dev/null 2>&1; then
                echo "Rollback health check passed!"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 2
            done
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "Rollback health check failed"
              exit 1
            fi
            
            echo "Rollback completed successfully to backups/$BACKUP_DIR"
          EOF

      - name: Notify rollback
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Manual rollback executed: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

