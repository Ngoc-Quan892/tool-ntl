# CDN Configuration for Nginx
# Include this in your main nginx.conf for CDN setup

# CDN Headers
map $sent_http_content_type $cdn_cache_control {
    default "public, max-age=31536000, immutable";
    "text/html" "public, max-age=0, must-revalidate";
    "application/json" "public, max-age=300";
    "text/css" "public, max-age=31536000, immutable";
    "application/javascript" "public, max-age=31536000, immutable";
    "image/png" "public, max-age=31536000, immutable";
    "image/jpeg" "public, max-age=31536000, immutable";
    "image/svg+xml" "public, max-age=31536000, immutable";
    "font/woff" "public, max-age=31536000, immutable";
    "font/woff2" "public, max-age=31536000, immutable";
}

# Cache static assets
location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
    # CDN headers
    add_header Cache-Control $cdn_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    
    # CORS for CDN (if needed)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    
    # Expires header (fallback)
    expires 1y;
    access_log off;
    
    # Gzip compression
    gzip_static on;
    
    # Try to serve from CDN first, fallback to local
    try_files $uri =404;
}

# Pre-compressed files (for CDN)
location ~* \.(js|css|svg|json)$ {
    gzip_static on;
    brotli_static on;
}

# Security headers for CDN
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CDN Health Check
location /cdn-health {
    access_log off;
    return 200 "CDN OK\n";
    add_header Content-Type text/plain;
}

