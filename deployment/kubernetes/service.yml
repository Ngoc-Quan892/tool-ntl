apiVersion: v1
kind: Service
metadata:
  name: baccarat-backend
spec:
  selector:
    app: baccarat-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: baccarat-frontend
spec:
  selector:
    app: baccarat-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5173
  type: LoadBalancer

